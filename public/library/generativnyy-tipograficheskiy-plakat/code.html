<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Typography Experiment</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f4f4f4;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 320px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
        }
        input, select, button {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-family: inherit;
        }
        button {
            background-color: #111;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="input-group">
            <label for="macroInput">Макро-форма (Большой силуэт):</label>
            <input type="text" id="macroInput" value="100">
        </div>

        <div class="input-group">
            <label for="textInput">Микро-текст (Из чего лепим):</label>
            <input type="text" id="textInput" value="TYPE EXPERIMENT CHINA">
        </div>
        
        <div class="input-group">
            <label for="fontSelect">Шрифт:</label>
            <select id="fontSelect">
                <option value="Times New Roman">Serif (Times New Roman)</option>
                <option value="Arial">Sans-Serif (Arial)</option>
                <option value="Courier New">Monospace (Courier)</option>
            </select>
        </div>
        
        <button id="generateBtn">Сгенерировать заново</button>
        <button id="stopBtn">Остановить отрисовку</button>
    </div>

    <canvas id="posterCanvas"></canvas>

    <script>
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');
        const macroInput = document.getElementById('macroInput');
        const textInput = document.getElementById('textInput');
        const fontSelect = document.getElementById('fontSelect');
        const generateBtn = document.getElementById('generateBtn');
        const stopBtn = document.getElementById('stopBtn');

        let width, height;
        let animationId;
        let isDrawing = false;
        let validPoints = [];
        let iterations = 0;
        const maxIterations = 8000; // Увеличил лимит, так как область больше

        // Настройка размеров
        function resize() {
            // Исключаем возможность получения ширины или высоты равной 0,
            // что вызывало ошибку IndexSizeError в функции getImageData
            width = Math.max(1, window.innerWidth);
            height = Math.max(1, window.innerHeight);
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', () => {
            resize();
            startGeneration();
        });

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // --- МАГИЯ МАСКИРОВАНИЯ ---
        // Создаем невидимый холст, пишем на нем большую форму и достаем координаты
        function prepareMask() {
            if (width <= 0 || height <= 0) return; // Дополнительная защита

            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            
            // Используем логические размеры для маски (без pixelRatio) для скорости
            offCanvas.width = width;
            offCanvas.height = height;

            // Рисуем макро-форму
            offCtx.fillStyle = 'black';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            
            const textToDraw = macroInput.value.toUpperCase(); // Всегда капс
            let macroFontSize = Math.min(width, height) * 0.4; // Базовый крупный размер
            offCtx.font = `bold ${macroFontSize}px ${fontSelect.value}`;
            
            // Жесткий перенос по буквам (даже если это одно слово)
            const maxWidth = width * 0.9;
            let lines = [];
            let currentLine = "";
            
            for (let i = 0; i < textToDraw.length; i++) {
                let char = textToDraw[i];
                let testLine = currentLine + char;
                let metrics = offCtx.measureText(testLine);
                if (metrics.width > maxWidth && currentLine.length > 0) {
                    lines.push(currentLine);
                    currentLine = char;
                } else {
                    currentLine = testLine;
                }
            }
            lines.push(currentLine);

            // Отрисовка текста с минимальным межстрочным интервалом
            const lineHeight = macroFontSize * 0.75; // Отступ минимальный, строки накладываются
            const totalHeight = lines.length * lineHeight;
            let startY = (height - totalHeight) / 2 + macroFontSize / 2;
            
            for(let i = 0; i < lines.length; i++) {
                offCtx.fillText(lines[i], width / 2, startY + (i * lineHeight));
            }

            // Сканируем пиксели
            validPoints = [];
            
            try {
                const imgData = offCtx.getImageData(0, 0, width, height).data;
                
                // Проходим по пикселям с шагом (например 4), чтобы не сохранять миллионы точек
                const step = 4;
                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const alpha = imgData[(y * width + x) * 4 + 3]; // Читаем альфа-канал
                        if (alpha > 128) {
                            validPoints.push({x, y});
                        }
                    }
                }
            } catch (e) {
                console.error("Ошибка при чтении пикселей маски:", e);
            }
        }

        // Возвращенная "первая" версия отрисовки (дикая, хаотичная, с кривыми)
        function drawScribbleAt(x, y) {
            const text = textInput.value;
            // Размер букв варьируется для создания текстуры
            const fontSize = random(10, 60);
            
            ctx.font = `${fontSize}px ${fontSelect.value}`;
            // Эффект шариковой ручки: чуть синевато-черный, тонкие линии
            ctx.fillStyle = 'rgba(10, 15, 25, 0.05)'; 
            ctx.strokeStyle = 'rgba(10, 15, 25, 0.05)';
            ctx.lineWidth = 0.3;

            ctx.save();
            
            // Небольшой разброс вокруг целевой точки, чтобы края были "рваными"
            ctx.translate(x + random(-20, 20), y + random(-20, 20));
            
            // Хаотичное вращение, как в первой версии
            ctx.rotate(random(-0.3, 0.3));

            // Рисуем либо контур, либо заливку
            if (Math.random() > 0.5) {
                ctx.fillText(text, 0, 0);
            } else {
                ctx.strokeText(text, 0, 0);
            }
            
            // Добавляем те самые случайные "царапины" и кривые Безье
            if (Math.random() > 0.9) {
                ctx.beginPath();
                ctx.moveTo(random(-150, 150), random(-20, 20));
                ctx.bezierCurveTo(
                    random(-100, 100), random(-100, 100), 
                    random(-100, 100), random(-100, 100), 
                    random(-150, 150), random(-20, 20)
                );
                ctx.stroke();
            }

            ctx.restore();
        }

        // Основной цикл анимации
        function generateFrame() {
            if (!isDrawing) return;
            if (validPoints.length === 0 || iterations > maxIterations) {
                isDrawing = false;
                return;
            }

            // За один кадр рисуем сразу несколько элементов (быстрее формируется)
            for(let i = 0; i < 40; i++) {
                // Берем случайную точку из разрешенных
                const randomIndex = Math.floor(Math.random() * validPoints.length);
                const point = validPoints[randomIndex];
                
                drawScribbleAt(point.x, point.y);
                iterations++;
            }

            animationId = requestAnimationFrame(generateFrame);
        }

        function startGeneration() {
            if (animationId) cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, width, height);
            
            // Подготавливаем форму (фон теперь чистый, сетка убрана)
            prepareMask();

            iterations = 0;
            isDrawing = true;
            generateFrame();
        }

        generateBtn.addEventListener('click', startGeneration);
        stopBtn.addEventListener('click', () => { isDrawing = false; });

        // Запуск при старте
        resize();
        startGeneration();

    </script>
</body>
</html>
