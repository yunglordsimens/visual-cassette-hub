<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спектральная Иллюзия | Параллакс и Стекло</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Manrope', sans-serif;
            color: var(--text-main);
        }

        /* Контейнер сцены для параллакса */
        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Слои секвенции */
        .layer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            margin-top: -75vmax;
            margin-left: -75vmax;
            background-image: url('image.png');
            background-size: 50%;
            background-position: center;
            background-repeat: no-repeat;
            mix-blend-mode: screen; /* Позволяет светящимся частям красиво накладываться */
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
            opacity: 0;
            animation: fadeInSeq 2s forwards;
        }

        /* Настройка индивидуальных слоев (блюр, глубина, масштаб) */
        .layer-1 { 
            filter: blur(40px); 
            animation-delay: 0s;
        }
        .layer-2 { 
            filter: blur(20px); 
            animation-delay: 0.3s;
        }
        .layer-3 { 
            filter: blur(8px); 
            animation-delay: 0.6s;
        }
        .layer-4 { 
            filter: blur(0px); 
            animation-delay: 0.9s;
        }

        @keyframes fadeInSeq {
            from { opacity: 0; filter: brightness(0); }
            to { opacity: 1; filter: brightness(1); }
        }

        /* Эффект стекла (Glassmorphism) */
        .glass-panel {
            position: absolute;
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
            width: 380px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 10;
            opacity: 0;
            animation: slideInGlass 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
        }

        @keyframes slideInGlass {
            from { opacity: 0; transform: translate(-50px, -50%); }
            to { opacity: 1; transform: translate(0, -50%); }
        }

        /* Типографика */
        .overline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            font-weight: 400;
            margin: 0 0 32px 0;
        }

        /* Индикатор секвенции */
        .sequence-indicator {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
        }

        .seq-dot {
            width: 32px;
            height: 2px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .seq-dot::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: #fff;
            transform: translateX(-100%);
            animation: seqProgress 4s infinite;
        }

        .seq-dot:nth-child(2)::after { animation-delay: 1s; }
        .seq-dot:nth-child(3)::after { animation-delay: 2s; }
        .seq-dot:nth-child(4)::after { animation-delay: 3s; }

        @keyframes seqProgress {
            0% { transform: translateX(-100%); }
            25%, 100% { transform: translateX(0); }
        }

        /* Декоративный элемент */
        .btn-outline {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 100px;
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background: #fff;
            color: #000;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .glass-panel {
                left: 5%;
                right: 5%;
                width: auto;
                max-width: none;
                padding: 30px;
            }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div id="scene">
        <!-- Слои параллакса и блюра. data-depth отвечает за силу смещения, data-scale за базовый размер -->
        <div class="layer layer-1" data-depth="0.10" data-scale="1.6" style="opacity: 0.3;"></div>
        <div class="layer layer-2" data-depth="0.25" data-scale="1.3" style="opacity: 0.6;"></div>
        <div class="layer layer-3" data-depth="0.50" data-scale="1.1" style="opacity: 0.8;"></div>
        <div class="layer layer-4" data-depth="0.90" data-scale="1.0" style="opacity: 1;"></div>
    </div>

    <!-- UI со стеклом -->
    <div class="glass-panel">
        <span class="overline">Интерактивный холст</span>
        <h1>Оптическая секвенция</h1>
        
        <div class="sequence-indicator">
            <div class="seq-dot"></div>
            <div class="seq-dot"></div>
            <div class="seq-dot"></div>
            <div class="seq-dot"></div>
        </div>

        <p>Многослойная дисперсия света, усиленная эффектом глубокого параллакса. Элементы интерфейса используют преломление фона через матовое стекло.</p>
        
        <a href="#" class="btn-outline">СИНХРОНИЗИРОВАТЬ</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const layers = document.querySelectorAll('.layer');
            const scene = document.getElementById('scene');
            
            // Начальные значения координат (центр экрана)
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            
            // Целевые значения для плавности
            let targetX = 0;
            let targetY = 0;
            let currentX = 0;
            let currentY = 0;

            // Отслеживание мыши
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Отслеживание касаний (для мобильных)
            document.addEventListener('touchmove', (e) => {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            });

            // Цикл анимации (Smooth Parallax)
            function animateParallax() {
                // Вычисляем отклонение курсора от центра от -1 до 1
                targetX = (mouseX / window.innerWidth - 0.5) * 2;
                targetY = (mouseY / window.innerHeight - 0.5) * 2;

                // Интерполяция для плавного движения (lerp)
                currentX += (targetX - currentX) * 0.05;
                currentY += (targetY - currentY) * 0.05;

                layers.forEach(layer => {
                    const depth = parseFloat(layer.getAttribute('data-depth'));
                    const scale = parseFloat(layer.getAttribute('data-scale'));
                    
                    // Чем больше depth, тем сильнее слой реагирует на курсор
                    const moveX = currentX * depth * -100; // Отрицательное значение для инверсии движения
                    const moveY = currentY * depth * -100;

                    // Применяем трансформацию, сохраняя изначальный масштаб
                    layer.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;
                });

                requestAnimationFrame(animateParallax);
            }

            // Инициализируем первоначальный скейл до начала анимации мыши
            layers.forEach(layer => {
                const scale = parseFloat(layer.getAttribute('data-scale'));
                layer.style.transform = `translate(0px, 0px) scale(${scale})`;
            });

            // Запускаем цикл
            animateParallax();
        });
    </script>
</body>
</html>
