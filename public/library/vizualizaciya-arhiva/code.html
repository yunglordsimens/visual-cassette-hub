<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>6000OVECEK & EVRO661 — Архив</title>

    <!-- Подключение шрифтов из оригинального проекта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Скрываем скролл для 3D сцены */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Шум на фоне для панк-эстетики */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            opacity: 0.05;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        /* Типографика шапки */
        header {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 5px;
            mix-blend-mode: difference;
        }

        p.subtitle {
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* 3D Сцена */
        #scene {
            width: 100vw;
            height: 100vh;
            perspective: 1000px; /* Глубина пространства */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        #scene:active {
            cursor: grabbing;
        }

        #carousel {
            width: 280px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            /* Плавность вращения через JS, здесь транзиции не нужны */
        }

        /* Карточки архива */
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #1a1a1a;
            /* Начальное позиционирование (обновляется через JS) */
            transform: rotateY(0deg) translateZ(450px);
            transition: filter 0.4s ease;
            filter: grayscale(80%) brightness(0.6);
        }

        .card.active, .card:hover {
            filter: grayscale(0%) brightness(1);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Чтобы не мешать драгу */
        }

        .card-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            font-family: 'Anton', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Инструкция снизу */
        .instructions {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            pointer-events: none;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* Кнопка доната (стилизована под эстетику) */
        .donate-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 4px;
            overflow: hidden;
        }

        .donate-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: #005BBB; /* Синий цвет флага Украины */
            z-index: -1;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        .donate-btn::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 50%;
            background: #FFD500; /* Желтый цвет флага Украины */
            z-index: -1;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .donate-btn:hover {
            border-color: transparent;
            color: #000;
        }

        .donate-btn:hover::before,
        .donate-btn:hover::after {
            transform: translateY(0);
        }

        /* Адаптив */
        @media (max-width: 768px) {
            header { top: 20px; left: 20px; }
            h1 { font-size: 2.5rem; }
            #carousel { width: 200px; height: 300px; }
            .donate-btn { bottom: 20px; right: 20px; padding: 10px 16px; font-size: 0.8rem; }
            .instructions { bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>

    <header>
        <h1>6000OVECEK<br>& EVRO661</h1>
        <p class="subtitle">Визуальный архив / 2024-2026</p>
    </header>

    <div id="scene">
        <div id="carousel">
            <!-- Карточки генерируются через JS -->
        </div>
    </div>

    <div class="instructions">Свайп для вращения</div>

    <!-- Кнопка Donate -->
    <a href="https://donio.cz/drony-solidarity-ctyri" target="_blank" rel="noopener" class="donate-btn" title="Donate for Ukraine">
        Donate for Ukraine
    </a>

    <script>
        // --- Настройки карусели ---
        // Используем плейсхолдеры для демонстрации (замените на свои пути без ./)
        const images = [
            'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1493225457124-a1a2a5f5f9af?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1493225457124-a1a2a5f5f9af?w=600&h=800&fit=crop&q=80', // Повторы для объема
            'https://images.unsplash.com/photo-1520004434532-668416a08753?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1506157786151-b8491531f063?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=600&h=800&fit=crop&q=80',
            'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&h=800&fit=crop&q=80'
        ];

        const carousel = document.getElementById('carousel');
        const numCards = images.length;
        const theta = 360 / numCards; // Угол между карточками
        
        // Автоматический расчет радиуса в зависимости от ширины карточки и их количества
        const cardWidth = window.innerWidth > 768 ? 280 : 200;
        const radius = Math.round((cardWidth / 2) / Math.tan(Math.PI / numCards)); 

        // Создаем карточки
        images.forEach((src, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Архив фото ${index + 1}`;
            
            const label = document.createElement('div');
            label.className = 'card-label';
            label.innerText = `ПРОЕКТ 0${index + 1}`;

            card.appendChild(img);
            card.appendChild(label);
            
            // Распределяем карточки по кругу
            const angle = theta * index;
            card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
            
            carousel.appendChild(card);
        });

        // --- Логика взаимодействия (Драг / Свайп) ---
        let currentY = 0; // Текущий угол вращения
        let targetY = 0;  // Целевой угол (для плавности)
        let isDragging = false;
        let startX = 0;
        let lastX = 0;
        let velocity = 0;

        const scene = document.getElementById('scene');

        // Обработка мыши
        scene.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            lastX = e.clientX;
            velocity = 0;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - lastX;
            lastX = e.clientX;
            targetY += deltaX * 0.5; // Чувствительность
            velocity = deltaX * 0.5;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Обработка тач-событий (сенсорные экраны)
        scene.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            lastX = e.touches[0].clientX;
            velocity = 0;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - lastX;
            lastX = e.touches[0].clientX;
            targetY += deltaX * 0.6; 
            velocity = deltaX * 0.6;
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        // --- Анимационный цикл (requestAnimationFrame) ---
        function animate() {
            // Инерция после отпускания
            if (!isDragging) {
                targetY += velocity;
                velocity *= 0.95; // Затухание инерции (трение)
            }

            // Авто-вращение, если пользователь ничего не делает
            if (!isDragging && Math.abs(velocity) < 0.1) {
                targetY -= 0.1; // Медленное вращение против часовой стрелки
            }

            // Плавное приближение текущего угла к целевому (Ease)
            currentY += (targetY - currentY) * 0.1;
            
            carousel.style.transform = `translateZ(${-radius}px) rotateY(${currentY}deg)`;

            // Выделение "активной" (центральной) карточки
            // Вычисляем, какая карточка сейчас ближе всего к зрителю
            let normalizedAngle = currentY % 360;
            if (normalizedAngle < 0) normalizedAngle += 360;
            
            // Находим индекс карточки смотрящей вперед
            const activeIndex = Math.round((360 - normalizedAngle) / theta) % numCards;
            
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                if (index === activeIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            requestAnimationFrame(animate);
        }

        // Запуск анимации
        animate();

        // Обновление радиуса при изменении размера окна (чтобы не ломалось на мобильных)
        window.addEventListener('resize', () => {
            const newCardWidth = window.innerWidth > 768 ? 280 : 200;
            const newRadius = Math.round((newCardWidth / 2) / Math.tan(Math.PI / numCards));
            
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                const angle = theta * index;
                card.style.transform = `rotateY(${angle}deg) translateZ(${newRadius}px)`;
            });
        });
    </script>
</body>
</html>
