<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glass Pebbles Morphing</title>
    <style>
        :root {
            /* Сюда JS подставит сгенерированный фон */
            --bg-image: none; 
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            /* Устанавливаем фон для всей страницы */
            background-image: var(--bg-image);
            background-size: 100vw 100vh;
            background-repeat: no-repeat;
            background-position: center;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            /* Небольшой блюр самого контейнера для параллакса */
            perspective: 1000px; 
        }

        /* БАЗОВЫЙ КЛАСС ДЛЯ ГАЛЬКИ */
        .pebble {
            position: absolute;
            /* Центрирование трансформом для удобства */
            transform-style: preserve-3d;
            
            /* СЕКРЕТ ИЛЛЮЗИИ РЕФРАКЦИИ */
            background-image: var(--bg-image);
            background-attachment: fixed; /* Привязывает фон камня к экрану */
            
            /* СЕКРЕТ ОБЪЕМА (Имитация 3D через тени) */
            box-shadow: 
                /* 1. Жесткий белый блик сверху слева */
                inset 10px 15px 20px rgba(255, 255, 255, 0.9),
                /* 2. Мягкий рассеянный свет сверху */
                inset 30px 30px 40px rgba(255, 255, 255, 0.5),
                /* 3. Глубокая темная тень снизу справа для объема */
                inset -15px -20px 30px rgba(0, 0, 0, 0.2),
                /* 4. Белый рефлекс (отскок света) на самом дне */
                inset 0px -5px 15px rgba(255, 255, 255, 0.6),
                /* 5. Внешняя падающая тень */
                15px 25px 35px rgba(0, 0, 0, 0.15);
            
            /* Смягчаем края стекла */
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Дополнительный супер-резкий блик на поверхности */
        .pebble::after {
            content: '';
            position: absolute;
            top: 8%;
            left: 10%;
            width: 40%;
            height: 30%;
            background: radial-gradient(ellipse at top left, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 60%);
            border-radius: 50%;
            transform: rotate(-25deg);
            pointer-events: none;
        }

        /* РАЗНЫЕ КАМУШКИ: Размеры, преломление и анимации */
        
        /* 1. Центральный (самый большой, искажает сильнее всего) */
        .p1 {
            width: 450px; height: 350px;
            top: calc(50% - 175px); left: calc(50% - 225px);
            background-size: 115vw 115vh; /* Увеличение = эффект линзы */
            background-position: -7vw -7vh; /* Смещение центра линзы */
            animation: morph-triangle 12s ease-in-out infinite alternate;
        }

        /* 2. Правый вытянутый */
        .p2 {
            width: 300px; height: 450px;
            top: 20%; left: 60%;
            background-size: 108vw 108vh;
            background-position: -4vw -4vh;
            animation: morph-long 15s ease-in-out infinite alternate-reverse;
            box-shadow: inset 10px 15px 20px rgba(255, 255, 255, 0.9), inset -15px -20px 30px rgba(0, 0, 0, 0.2), 10px 20px 30px rgba(0, 0, 0, 0.1);
        }

        /* 3. Левый каплевидный */
        .p3 {
            width: 350px; height: 350px;
            top: 15%; left: 15%;
            background-size: 112vw 112vh;
            background-position: -6vw -6vh;
            animation: morph-blob 10s ease-in-out infinite alternate;
        }

        /* 4. Мелкий снизу (почти круглый) */
        .p4 {
            width: 200px; height: 200px;
            top: 70%; left: 45%;
            background-size: 105vw 105vh;
            background-position: -2.5vw -2.5vw;
            animation: morph-round 8s ease-in-out infinite alternate-reverse;
        }

        /* 5. Левый нижний */
        .p5 {
            width: 280px; height: 220px;
            top: 65%; left: 20%;
            background-size: 109vw 109vh;
            background-position: -4.5vw -4.5vh;
            animation: morph-triangle 14s ease-in-out infinite alternate;
            animation-delay: -5s;
        }

        /* АНИМАЦИИ МОРФИНГА (Плавное изменение формы гальки) */
        
        /* Морфинг в треугольную/каплевидную форму */
        @keyframes morph-triangle {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            33% { border-radius: 70% 30% 40% 60% / 60% 40% 70% 40%; } /* Сужается к верху */
            66% { border-radius: 30% 70% 50% 50% / 30% 60% 40% 70%; }
            100% { border-radius: 50% 50% 30% 70% / 50% 40% 60% 50%; }
        }

        /* Вытянутая органичная форма */
        @keyframes morph-long {
            0% { border-radius: 30% 70% 60% 40% / 50% 30% 70% 50%; }
            50% { border-radius: 50% 50% 40% 60% / 30% 60% 40% 70%; }
            100% { border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%; }
        }

        /* Классический округлый блоб */
        @keyframes morph-blob {
            0% { border-radius: 50% 50% 60% 40% / 40% 60% 40% 60%; }
            50% { border-radius: 40% 60% 40% 60% / 60% 40% 60% 40%; }
            100% { border-radius: 60% 40% 50% 50% / 50% 50% 40% 60%; }
        }

        @keyframes morph-round {
            0% { border-radius: 45% 55% 50% 50% / 50% 45% 55% 50%; }
            100% { border-radius: 55% 45% 50% 50% / 45% 55% 45% 50%; }
        }

    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Наши камушки -->
        <div class="pebble p1" data-speed="0.8"></div>
        <div class="pebble p2" data-speed="1.2"></div>
        <div class="pebble p3" data-speed="0.5"></div>
        <div class="pebble p4" data-speed="1.5"></div>
        <div class="pebble p5" data-speed="0.9"></div>
    </div>

    <script>
        // Функция для рисования типографики на фоне
        function generateBackground() {
            const canvas = document.createElement('canvas');
            // Умножаем на 2 для четкости (ретина)
            canvas.width = window.innerWidth * 2;
            canvas.height = window.innerHeight * 2;
            const ctx = canvas.getContext('2d');

            // Заливаем светло-серым
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Настраиваем шрифт
            ctx.fillStyle = '#111'; // Почти черный для контраста
            // Размер шрифта зависит от высоты экрана
            const fontSize = canvas.height * 1.5; 
            ctx.font = `bold ${fontSize}px "Times New Roman", Times, serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Рисуем гигантскую букву "a" по центру
            ctx.fillText('a', canvas.width / 2, canvas.height / 2 + (canvas.height * 0.1));

            // Рисуем резкую диагональную линию для экстра-контраста в стекле
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.8);
            ctx.lineTo(canvas.width, canvas.height * 0.2);
            ctx.lineWidth = 150;
            ctx.strokeStyle = '#111';
            ctx.stroke();

            // Передаем полученную картинку в CSS
            const dataURL = canvas.toDataURL('image/webp', 0.8);
            document.documentElement.style.setProperty('--bg-image', `url(${dataURL})`);
        }

        // Генерируем фон при загрузке и при ресайзе окна
        window.addEventListener('load', generateBackground);
        window.addEventListener('resize', generateBackground);

        // Легкий эффект параллакса при движении мыши (для глубины 3D)
        const pebbles = document.querySelectorAll('.pebble');
        
        document.addEventListener('mousemove', (e) => {
            // Вычисляем позицию мыши от -1 до 1
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;

            pebbles.forEach(pebble => {
                const speed = parseFloat(pebble.getAttribute('data-speed'));
                // Смещаем камушки
                pebble.style.transform = `translate(${x * 30 * speed}px, ${y * 30 * speed}px)`;
            });
        });
    </script>
</body>
</html>
