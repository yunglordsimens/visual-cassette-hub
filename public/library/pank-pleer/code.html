<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Брутальный Панк Плеер</title>
  <style>
    :root {
      --bg-color: #050505; /* Глубокий черный */
      --text-color: #e0e0e0; /* Грязный белый */
      --border-color: #333333; /* Темно-серый для рамок */
    }

    /* Сюда идеально встанет твой кастомный гранж-шрифт из UMPRUM.
      Раскомментируй и поменяй url, когда он будет готов:
      @font-face {
        font-family: 'MyGrungeFont';
        src: url('fonts/my-grunge-font.woff2') format('woff2');
      }
    */

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #050505;
      /* Пока моноширинный для стиля сценария или печатной машинки */
      font-family: 'Courier New', Courier, monospace; 
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      overflow: hidden;
    }

    /* Фоновое видео */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      filter: grayscale(100%) contrast(1.2); /* ЧБ и контраст */
      opacity: 0.4; /* Приглушаем для мрачности */
    }

    /* Кинематографичная виньетка поверх видео */
    .vignette {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      box-shadow: inset 0 0 250px rgba(0,0,0,0.95);
      z-index: -1;
    }

    .placeholder-text {
      text-align: center;
      opacity: 0.15;
      font-size: 2vw;
      text-transform: uppercase;
      letter-spacing: 12px;
      text-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    /* Кнопка вызова */
    #punk-toggle {
      position: fixed;
      bottom: 40px;
      right: 40px;
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      width: 55px;
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.4s ease;
      z-index: 100;
    }

    #punk-toggle:hover {
      background-color: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
      box-shadow: 0 0 20px rgba(255,255,255,0.15);
      transform: scale(1.05);
    }

    /* Контейнер плеера */
    #punk-player {
      position: fixed;
      bottom: 110px;
      right: 40px;
      width: 320px;
      background-color: rgba(5, 5, 5, 0.7);
      border: 1px solid var(--border-color);
      padding: 35px;
      /* Кинематографичный медленный выезд */
      transform: translateX(150%);
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
      color: var(--text-color);
      backdrop-filter: blur(15px);
      box-shadow: -15px 15px 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(255,255,255,0.03);
    }

    /* Класс для выезда плеера */
    #punk-player.active {
      transform: translateX(0);
    }

    .player-header h3 {
      margin: 0 0 15px 0;
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.4;
      font-weight: normal;
    }

    #track-name {
      font-size: 20px;
      font-weight: normal;
      color: var(--text-color);
      margin-bottom: 35px;
      display: block;
      text-transform: uppercase;
      word-break: break-word;
      letter-spacing: 3px;
      border-bottom: 1px solid #222;
      padding-bottom: 15px;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
      /* Мерцание старой пленки */
      animation: flicker 5s infinite alternate;
    }

    @keyframes flicker {
      0% { opacity: 0.9; }
      5% { opacity: 0.5; }
      10% { opacity: 0.9; }
      15% { opacity: 1; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    /* Кнопки управления */
    .controls {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .controls button {
      flex: 1;
      background: transparent;
      border: 1px solid #222;
      color: var(--text-color);
      padding: 12px;
      font-size: 12px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      text-transform: uppercase;
    }

    .controls button:hover {
      background: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .controls button:active {
      transform: scale(0.97);
    }

    /* Стилизация скроллбара */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050505; 
    }
    ::-webkit-scrollbar-thumb {
      background: #333; 
    }
  </style>
</head>
<body>

  <!-- Фоновое видео (чернильные разводы) -->
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-ink-swirling-in-water-2226-large.mp4" type="video/mp4">
  </video>

  <!-- Слой с виньеткой -->
  <div class="vignette"></div>

  <div class="placeholder-text">
    Твой сайт<br>Нажми кнопку внизу справа
  </div>

  <!-- Кнопка, которая будет торчать в углу -->
  <button id="punk-toggle">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
  </button>

  <!-- Сам выезжающий плеер -->
  <div id="punk-player">
    <div class="player-header">
      <h3>СЕЙЧАС ОРЁТ:</h3>
      <div id="track-name">Выбери трек</div>
    </div>
    
    <div class="controls">
      <button id="prev-btn">◄◄</button>
      <button id="play-btn">PLAY</button>
      <button id="next-btn">►►</button>
    </div>
    
    <!-- Скрытый элемент аудио -->
    <audio id="audio-element"></audio>
  </div>

  <script>
    // Твоя база треков. Добавляй сюда что угодно.
    // Пути прописаны от корня, без ./
    const myTracks = [
      { title: "TRACK ONE", src: "audio/my-first-track.mp3" },
      { title: "ANARCHY BASS", src: "audio/heavy-bass.wav" },
      { title: "NO FUTURE", src: "audio/punk-rock.mp3" }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;

    // Хватаем элементы
    const player = document.getElementById('punk-player');
    const toggleBtn = document.getElementById('punk-toggle');
    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-btn');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');
    const trackName = document.getElementById('track-name');

    const playIcon = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`;
    const closeIcon = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

    // Выезжающая панель
    toggleBtn.addEventListener('click', () => {
      player.classList.toggle('active');
      if (player.classList.contains('active')) {
        toggleBtn.innerHTML = closeIcon;
      } else {
        toggleBtn.innerHTML = playIcon;
      }
    });

    // Загрузка трека в плеер
    function loadTrack(index) {
      trackName.innerText = myTracks[index].title;
      audio.src = myTracks[index].src;
    }

    // Плей / Пауза
    function togglePlay() {
      // Проверка на пустой src для превью, чтобы не было ошибок в консоли,
      // пока ты не добавишь реальные файлы
      if (!audio.src || audio.src.includes('audio/')) {
         console.log("Пытаемся воспроизвести: " + myTracks[currentTrackIndex].src);
      }

      if (isPlaying) {
        audio.pause();
        playBtn.innerText = "PLAY";
      } else {
        // audio.play() может выдать ошибку, если файла нет, перехватываем её
        let playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.log("Файл пока не найден, добавь свои треки в папку audio");
          });
        }
        playBtn.innerText = "PAUSE";
      }
      isPlaying = !isPlaying;
    }

    // Следующий трек
    function nextTrack() {
      currentTrackIndex++;
      if (currentTrackIndex > myTracks.length - 1) {
        currentTrackIndex = 0; // Зацикливаем
      }
      loadTrack(currentTrackIndex);
      if (isPlaying) {
        let playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(e => console.log("Файл пока не найден"));
        }
      }
    }

    // Предыдущий трек
    function prevTrack() {
      currentTrackIndex--;
      if (currentTrackIndex < 0) {
        currentTrackIndex = myTracks.length - 1;
      }
      loadTrack(currentTrackIndex);
      if (isPlaying) {
        let playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(e => console.log("Файл пока не найден"));
        }
      }
    }

    // Слушатели кнопок плеера
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);

    // Автопереключение, когда трек кончился
    audio.addEventListener('ended', nextTrack);

    // Инициализация первого трека при загрузке
    loadTrack(currentTrackIndex);
  </script>
</body>
</html>
