<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Желейные сферы (Глубина резкости)</title>
    <style>
        /* Сброс стилей и настройка фона */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fdfaf5 0%, #f4e8e5 50%, #ead4d1 100%);
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Общая цветокоррекция (имитация фотопленки) */
        .camera-lens {
            filter: contrast(1.1) saturate(1.15) brightness(1.02);
        }

        /* Сетка 3x3 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 130px);
            grid-template-rows: repeat(3, 130px);
            gap: 25px;
            padding: 50px;
        }

        /* Базовые стили для каждой сферы */
        .drop {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            box-shadow: 
                20px 25px 35px rgba(0, 0, 0, 0.08),
                inset -15px -15px 25px rgba(0, 0, 0, 0.15),
                inset 10px 15px 20px rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            /* Плавный переход для экспериментов в браузере */
            transition: filter 0.3s ease;
        }

        /* Блики (источник света сверху слева) */
        .drop::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 35%;
            width: 45%;
            height: 35%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 60%);
            transform: rotate(-20deg);
            z-index: 2;
        }

        /* Нижний рефлекс от поверхности */
        .drop::after {
            content: '';
            position: absolute;
            bottom: 5%;
            right: 15%;
            width: 60%;
            height: 30%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(-20deg);
            z-index: 2;
        }

        /* Внутреннее ядро */
        .core {
            position: absolute;
            width: 35px;
            height: 25px;
            border-radius: 50%;
            /* Базовый микро-блюр для эффекта нахождения внутри прозрачной среды */
            filter: blur(1px);
            z-index: 1;
        }

        /* --- ЦВЕТОВЫЕ СХЕМЫ --- */

        /* 1-я колонка: Зеленые сферы */
        .green {
            background: radial-gradient(circle at 35% 25%, #d1ec71 0%, #769f1e 50%, #2a3d06 100%);
            box-shadow: 
                15px 25px 35px rgba(60, 80, 15, 0.15),
                inset -15px -20px 30px rgba(30, 50, 0, 0.5),
                inset 15px 20px 30px rgba(200, 255, 100, 0.5);
        }
        .green .core {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(220, 255, 130, 0.8) 0%, rgba(0,0,0,0) 60%);
            filter: blur(4px);
            top: 40%;
            left: 40%;
        }

        /* 2-я колонка: Прозрачные/молочные сферы */
        .clear {
            background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.95) 0%, rgba(240,240,240,0.6) 40%, rgba(180,180,180,0.4) 100%);
            backdrop-filter: blur(3px);
            box-shadow: 
                15px 25px 35px rgba(0, 0, 0, 0.1),
                inset -15px -20px 30px rgba(100, 100, 100, 0.2),
                inset 15px 20px 30px rgba(255, 255, 255, 0.9);
        }
        .clear .core {
            background: #4a2428;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.8), inset 2px 2px 4px rgba(255,255,255,0.2);
        }

        /* 3-я колонка: Ягодные сферы */
        .purple {
            background: radial-gradient(circle at 35% 25%, #e68eb0 0%, #9c3f62 45%, #421021 100%);
            box-shadow: 
                15px 25px 35px rgba(80, 20, 40, 0.2),
                inset -15px -20px 30px rgba(40, 5, 15, 0.6),
                inset 15px 20px 30px rgba(255, 170, 190, 0.5);
        }
        .purple .core {
            background: #250811;
            width: 40px;
            height: 30px;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.9);
        }


        /* --- ИНДИВИДУАЛЬНАЯ НАСТРОЙКА ФОКУСА И СВЕТА (ГРИП) --- */
        
        /* Верхний ряд: Сильный расфокус, засветка от верхнего света */
        .drop:nth-child(1) { filter: blur(9px) brightness(1.2) saturate(0.9); } /* Зеленая */
        .drop:nth-child(2) { filter: blur(7px) brightness(1.15); } /* Прозрачная */
        .drop:nth-child(3) { filter: blur(10px) brightness(1.25) opacity(0.85); } /* Ягодная (светлее всех) */

        /* Средний ряд: Зона резкости */
        .drop:nth-child(4) { filter: blur(3px) brightness(1.1); } /* Зеленая */
        .drop:nth-child(5) { filter: blur(0px) brightness(1.0); } /* Прозрачная (ИДЕАЛЬНЫЙ ФОКУС) */
        .drop:nth-child(6) { filter: blur(2px) brightness(0.95); } /* Ягодная */

        /* Нижний ряд: Расфокус переднего плана, уход в тень */
        .drop:nth-child(7) { filter: blur(6px) brightness(0.9) saturate(1.1); } /* Зеленая */
        .drop:nth-child(8) { filter: blur(5px) brightness(0.95); } /* Прозрачная */
        .drop:nth-child(9) { filter: blur(8px) brightness(0.75) saturate(1.2); } /* Ягодная (самая темная) */


        /* Органичные повороты и смещения ядер */
        .drop:nth-child(2) .core { transform: translate(-5px, -5px) rotate(-15deg); }
        .drop:nth-child(5) .core { transform: translate(0px, 5px) rotate(10deg); }
        .drop:nth-child(8) .core { transform: translate(5px, -2px) rotate(25deg); }

        .drop:nth-child(3) .core { transform: translate(5px, -8px) rotate(-5deg); }
        .drop:nth-child(6) .core { transform: translate(-2px, 3px) rotate(20deg); }
        .drop:nth-child(9) .core { transform: translate(0px, -5px) rotate(-10deg); }


        /* Искорка в правом нижнем углу */
        .sparkle {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 25px;
            height: 25px;
            background: white;
            clip-path: polygon(50% 0%, 55% 45%, 100% 50%, 55% 55%, 50% 100%, 45% 55%, 0% 50%, 45% 45%);
            filter: blur(1px);
            opacity: 0.9;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="camera-lens">
        <div class="grid">
            <!-- 1 Ряд (Дальний план, засветка) -->
            <div class="drop green"><div class="core"></div></div>
            <div class="drop clear"><div class="core"></div></div>
            <div class="drop purple"><div class="core"></div></div>

            <!-- 2 Ряд (Точка фокуса) -->
            <div class="drop green"><div class="core"></div></div>
            <div class="drop clear"><div class="core"></div></div>
            <div class="drop purple"><div class="core"></div></div>

            <!-- 3 Ряд (Передний план, тень) -->
            <div class="drop green"><div class="core"></div></div>
            <div class="drop clear"><div class="core"></div></div>
            <div class="drop purple"><div class="core"></div></div>
        </div>
    </div>

    <div class="sparkle"></div>

</body>
</html>
