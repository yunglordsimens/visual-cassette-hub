<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анимация Поглощения Капель</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #5b232a; /* Темно-бордовый фон, как на картинке */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .canvas-container {
      width: 100vmin;
      height: 100vmin;
      max-width: 600px;
      max-height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      /* Убираем стандартные выделения */
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Группа для первой капли (Нижняя левая) -->
      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          dur="8s"
          keyTimes="0; 0.15; 0.9; 1"
          values="-200 200; 0 0; 0 0; -200 200"
          calcMode="spline"
          keySplines="0.2 0 0.2 1; 0 0 1 1; 0.8 0 0.8 1"
          repeatCount="indefinite"
        />
        
        <!-- Путь первой капли, который трансформируется в круг и вобблит -->
        <path id="dropA" fill="#fdf4e7">
          <animate
            attributeName="d"
            dur="8s"
            keyTimes="0; 0.1; 0.2; 0.3; 0.4; 0.55; 0.8; 0.9; 1"
            values="
              M 75,80 C 90,85 105,95 130,115 C 125,135 105,145 95,145 C 70,145 55,130 55,115 C 55,95 65,75 75,80;
              M 72,83 C 92,82 108,98 128,118 C 122,138 102,142 92,148 C 68,142 58,128 52,112 C 58,92 68,78 72,83; 
              M 78,77 C 88,88 102,92 132,112 C 128,132 108,148 98,142 C 72,148 52,132 58,118 C 52,98 62,72 78,77;
              M 75,80 C 90,85 105,95 130,115 C 125,135 105,145 95,145 C 70,145 55,130 55,115 C 55,95 65,75 75,80;
              M 75,80 C 90,85 105,95 130,115 C 125,135 105,145 95,145 C 70,145 55,130 55,115 C 55,95 65,75 75,80;
              M 100,55 C 124.8,55 145,75.2 145,100 C 145,124.8 124.8,145 100,145 C 75.2,145 55,124.8 55,100 C 55,75.2 75.2,55 100,55;
              M 100,55 C 124.8,55 145,75.2 145,100 C 145,124.8 124.8,145 100,145 C 75.2,145 55,124.8 55,100 C 55,75.2 75.2,55 100,55;
              M 75,80 C 90,85 105,95 130,115 C 125,135 105,145 95,145 C 70,145 55,130 55,115 C 55,95 65,75 75,80;
              M 75,80 C 90,85 105,95 130,115 C 125,135 105,145 95,145 C 70,145 55,130 55,115 C 55,95 65,75 75,80
            "
            calcMode="spline"
            keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0 0 1 1"
            repeatCount="indefinite"
          />
        </path>
      </g>

      <!-- Группа для второй капли (Верхняя правая) -->
      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          dur="8s"
          keyTimes="0; 0.15; 0.9; 1"
          values="200 -200; 0 0; 0 0; 200 -200"
          calcMode="spline"
          keySplines="0.2 0 0.2 1; 0 0 1 1; 0.8 0 0.8 1"
          repeatCount="indefinite"
        />
        
        <!-- Путь второй капли, который трансформируется в "вырез" -->
        <path id="dropB" fill="#fdf4e7">
          <animate
            attributeName="d"
            dur="8s"
            keyTimes="0; 0.1; 0.2; 0.3; 0.4; 0.55; 0.8; 0.9; 1"
            values="
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120;
              M 128,117 C 108,118 92,102 72,82 C 78,62 98,58 108,52 C 132,58 142,72 148,88 C 142,108 132,122 128,117;
              M 122,123 C 112,112 98,108 68,88 C 72,68 92,52 102,58 C 128,52 148,68 142,82 C 148,102 138,128 122,123;
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120;
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120;
              M 122,114 C 110,110 98,102 76,84 C 80,68 96,60 105,62 C 126,64 138,72 136,85 C 136,102 130,118 122,114;
              M 122,114 C 110,110 98,102 76,84 C 80,68 96,60 105,62 C 126,64 138,72 136,85 C 136,102 130,118 122,114;
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120;
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120
            "
            calcMode="spline"
            keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0 0 1 1"
            repeatCount="indefinite"
          />
        </path>
      </g>

      <!-- Группа для второй капли (Верхняя правая) -->
      <g>
        <!-- Анимация вылета второй капли из-за экрана (сверху-справа) -->
        <animateTransform
          attributeName="transform"
          type="translate"
          dur="8s"
          keyTimes="0; 0.15; 0.9; 1"
          values="200 -200; 0 0; 0 0; 200 -200"
          calcMode="spline"
          keySplines="0.2 0 0.2 1; 0 0 1 1; 0.8 0 0.8 1"
          repeatCount="indefinite"
        />
        
        <!-- Путь второй капли, который трансформируется в "вырез" -->
        <path id="dropB" fill="#fdf4e7">
          <!-- Анимация формы (немного сжимается для красивого отступа внутри круга) -->
          <animate
            attributeName="d"
            dur="8s"
            keyTimes="0; 0.4; 0.55; 0.8; 0.9; 1"
            values="
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120;
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120;
              M 122,114 C 110,110 98,102 76,84 C 80,68 96,60 105,62 C 126,64 138,72 136,85 C 136,102 130,118 122,114;
              M 122,114 C 110,110 98,102 76,84 C 80,68 96,60 105,62 C 126,64 138,72 136,85 C 136,102 130,118 122,114;
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120;
              M 125,120 C 110,115 95,105 70,85 C 75,65 95,55 105,55 C 130,55 145,70 145,85 C 145,105 135,125 125,120
            "
            calcMode="spline"
            keySplines="0 0 1 1; 0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0 0 1 1"
            repeatCount="indefinite"
          />
          <!-- Анимация цвета: капля становится цвета фона, образуя идеальную "дыру" внутри круга -->
          <animate
            attributeName="fill"
            dur="8s"
            keyTimes="0; 0.4; 0.55; 0.8; 0.9; 1"
            values="#fdf4e7; #fdf4e7; #5b232a; #5b232a; #fdf4e7; #fdf4e7"
            calcMode="linear"
            repeatCount="indefinite"
          />
        </path>
      </g>
    </svg>
  </div>

</body>
</html>
